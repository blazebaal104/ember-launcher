name: Build

# Every push to main builds the overlay mod and the Windows installer.
# A GitHub release is published when the commit message contains [release] or a v* tag is pushed.
# Build logs are pushed to ci-logs/<job>-<run> branches so they can be read without the Actions UI.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  overlay:
    name: Overlay mod (Minecraft 26.3)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mods/ember-overlay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Build
        run: gradle build --stacktrace 2>&1 | tee ../../overlay-build.log; exit ${PIPESTATUS[0]}
      - name: Self-test in a real (headless) game
        if: success()
        timeout-minutes: 15
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient -Pselftest --stacktrace 2>&1 | tee ../../overlay-selftest.log || true
          grep -q "EMBER_SELFTEST_OK" ../../overlay-selftest.log && echo "SELFTEST PASSED" || echo "SELFTEST DID NOT PASS"
      - name: Copy jar
        if: success()
        run: |
          mkdir -p ../../overlay-out
          cp build/libs/ember-overlay-*.jar ../../overlay-out/ 2>/dev/null || true
          rm -f ../../overlay-out/*-sources.jar
          ls -la ../../overlay-out
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: overlay-jar
          path: overlay-out/*.jar
          if-no-files-found: warn
      - name: Push logs
        if: always()
        working-directory: .
        run: |
          mkdir -p logs && cp overlay-*.log logs/ 2>/dev/null || true
          [ -d mods/ember-overlay/run/logs ] && cp -r mods/ember-overlay/run/logs logs/game-logs || true
          [ -d mods/ember-overlay/run/crash-reports ] && cp -r mods/ember-overlay/run/crash-reports logs/ || true
          echo "${{ job.status }}" > logs/STATUS
          cd logs && git init -q -b main && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "overlay logs ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs/overlay-${{ github.run_number }}

  windows:
    name: Windows installer
    needs: overlay
    if: always()
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Fetch overlay jar
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: overlay-jar
          path: overlay-out
      - name: Bundle overlay into the installer
        shell: pwsh
        run: |
          $jar = Get-ChildItem overlay-out -Filter *.jar -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($jar) { Copy-Item $jar.FullName apps/desktop/src-tauri/resources/overlay/ember-overlay-26.3.jar; "bundled $($jar.Name)" } else { "no overlay jar this run" }
      # `npm install` (not `npm ci`): the lockfile was created on Linux and npm
      # sometimes skips Windows-only optional packages with `ci`.
      - name: Install JS dependencies
        run: npm install
      - name: Tests
        shell: bash
        run: npm test 2>&1 | tee win-test.log
      - name: Build installer
        shell: bash
        working-directory: apps/desktop
        run: npm run tauri build 2>&1 | tee ../../win-build.log; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        with:
          name: ember-launcher-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}-build${{ github.run_number }}"
          gh release create "$TAG" target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi \
            --title "Ember Launcher ${VERSION} (build ${{ github.run_number }})" --prerelease \
            --notes "Download the -setup.exe below and run it. Windows may say \"Windows protected your PC\" because the installer isn't code-signed: choose More info, then Run anyway."
      - name: Push logs
        if: always()
        shell: bash
        run: |
          mkdir -p logs && cp win-*.log logs/ 2>/dev/null || true
          echo "${{ job.status }}" > logs/STATUS
          cd logs && git init -q -b main && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "windows logs ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs/windows-${{ github.run_number }}
