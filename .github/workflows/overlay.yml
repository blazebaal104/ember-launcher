name: Overlay mod

# Builds the in-game menu (ember-overlay) for every Minecraft version in
# mods/ember-overlay/versions.json, one parallel job per version, and boots each one in a real
# headless game to check every mixin applies. Jars are cached by a hash of the mod's sources,
# so unchanged versions finish in seconds.
#
# Pushes to main that touch the mod publish the tested jars to the "overlay" release, which
# Ember downloads at launch: menu fixes reach players in minutes, without an app update.
# Also used by build-windows.yml (to bundle an offline copy) and runs on overlay-dev branches
# as a test build (no publishing).

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
  push:
    branches: ["main", "overlay-dev", "overlay-dev/**", "overlay-dev-*"]
    paths: ["mods/ember-overlay/**", ".github/workflows/overlay.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(jq -c . mods/ember-overlay/versions.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: Overlay ${{ matrix.v.mc }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        v: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MC: ${{ matrix.v.mc }}
      ERA: ${{ matrix.v.era }}
    steps:
      - uses: actions/checkout@v4

      # Which source folders build this version: shared code + its family (legacy/modern) + its era.
      - name: Sources for this version
        id: src
        run: |
          if [[ "$ERA" == modern* ]]; then echo "family=modern" >> "$GITHUB_OUTPUT"; echo "era=$ERA" >> "$GITHUB_OUTPUT";
          else echo "family=legacy" >> "$GITHUB_OUTPUT"; echo "era=legacy-$ERA" >> "$GITHUB_OUTPUT"; fi

      # Only rebuild a version when code that goes into IT changed. Bump "t1" to force a
      # rebuild (for example after changing the self-test below).
      - name: Cached jar
        id: cache
        uses: actions/cache@v4
        with:
          path: overlay-out
          key: overlay-t1-${{ matrix.v.mc }}-${{ hashFiles('mods/ember-overlay/src/common/**', format('mods/ember-overlay/src/{0}/**', steps.src.outputs.family), format('mods/ember-overlay/src/{0}/**', steps.src.outputs.era), 'mods/ember-overlay/*.gradle', 'mods/ember-overlay/gradle.properties', 'mods/ember-overlay/legacy/**', 'mods/ember-overlay/tools/**') }}

      - name: Pick project and versions
        if: steps.cache.outputs.cache-hit != 'true'
        id: cfg
        run: |
          if [[ "$ERA" == modern* ]]; then echo "dir=mods/ember-overlay" >> "$GITHUB_OUTPUT"; echo "java=25" >> "$GITHUB_OUTPUT"; echo "gradle=9.8.2" >> "$GITHUB_OUTPUT";
          else echo "dir=mods/ember-overlay/legacy" >> "$GITHUB_OUTPUT"; echo "java=21" >> "$GITHUB_OUTPUT"; echo "gradle=9.2.1" >> "$GITHUB_OUTPUT"; fi
          # Newest Fabric API build for this Minecraft version, from Modrinth.
          FAPI=$(curl -fsSL "https://api.modrinth.com/v2/project/fabric-api/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%22${MC}%22%5D" | jq -r '[.[] | select(.version_type=="release")][0].version_number // .[0].version_number')
          LOADER=$(curl -fsSL https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version')
          COVERS=$(jq -c --arg mc "$MC" '.[] | select(.mc==$mc) | .covers' mods/ember-overlay/versions.json)
          FIRST=$(echo "$COVERS" | jq -r '.[0]'); LAST=$(echo "$COVERS" | jq -r '.[-1]')
          if [ "$FIRST" = "$LAST" ]; then RANGE="$FIRST"; else RANGE=">=$FIRST <=$LAST"; fi
          echo "fapi=$FAPI" >> "$GITHUB_OUTPUT"; echo "loader=$LOADER" >> "$GITHUB_OUTPUT"; echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          echo "Minecraft $MC ($ERA): Fabric API $FAPI, loader $LOADER, range '$RANGE'" | tee overlay-$MC-build.log

      # Minecraft itself, already unpacked and remapped by Loom (1-2 minutes per version otherwise).
      - name: Cached Minecraft
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.cfg.outputs.dir }}/.gradle/loom-cache
            ~/.gradle/caches/fabric-loom
          key: loom-${{ matrix.v.mc }}-${{ hashFiles('mods/ember-overlay/build.gradle', 'mods/ember-overlay/settings.gradle', 'mods/ember-overlay/legacy/*.gradle') }}

      - uses: actions/setup-java@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: ${{ steps.cfg.outputs.java }}
      - uses: gradle/actions/setup-gradle@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          gradle-version: ${{ steps.cfg.outputs.gradle }}

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ steps.cfg.outputs.dir }}
        run: |
          python3 "$GITHUB_WORKSPACE/mods/ember-overlay/tools/gen_legacy_compat.py"
          ARGS="-Pminecraft_version=$MC -Pfabric_api_version=${{ steps.cfg.outputs.fapi }} -Ploader_version=${{ steps.cfg.outputs.loader }} -Pera=$ERA"
          gradle build $ARGS "-Pmc_range=${{ steps.cfg.outputs.range }}" --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/overlay-$MC-build.log"; exit ${PIPESTATUS[0]}

      - name: Collect jar
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p overlay-out
          f=$(ls ${{ steps.cfg.outputs.dir }}/build/libs/ember-overlay-*.jar | grep -v sources | head -1)
          cp "$f" "overlay-out/ember-overlay-$MC.jar"
          ls -la overlay-out

      - name: Self-test in a real (headless) game
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        working-directory: ${{ steps.cfg.outputs.dir }}
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers imagemagick > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          ARGS="-Pminecraft_version=$MC -Pfabric_api_version=${{ steps.cfg.outputs.fapi }} -Ploader_version=${{ steps.cfg.outputs.loader }} -Pera=$ERA"
          LOG="$GITHUB_WORKSPACE/overlay-$MC-selftest.log"; : > "$LOG"
          export LOG MC GARGS="$ARGS" RANGE="${{ steps.cfg.outputs.range }}" OUT="$GITHUB_WORKSPACE"
          # Same virtual screen as before (xvfb-run sets up GLX correctly for 26.x); inside it a
          # watcher screenshots each menu page when the game prints "EMBER_SHOT <page>".
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" bash -c '
            ( tail -F --pid=$$ "$LOG" 2>/dev/null | while read -r line; do
                case "$line" in *EMBER_SHOT*)
                  n=$(echo "$line" | sed "s/.*EMBER_SHOT //" | tr -cd "a-z")
                  import -window root "$OUT/shot-$MC-$n.png" || true;;
                esac
              done ) &
            gradle runClient $GARGS "-Pmc_range=$RANGE" -Pselftest --stacktrace >> "$LOG" 2>&1
          ' || true
          # Screenshots the game saved itself (more reliable than grabbing the virtual screen).
          for f in run/ember-shots/*.png; do [ -f "$f" ] && cp "$f" "$GITHUB_WORKSPACE/shot-$MC-$(basename "$f")"; done
          tail -n 40 "$LOG"
          if grep -q "EMBER_SELFTEST_OK" "$LOG" && grep -q "EMBER_SELFTEST_UI_OK" "$LOG"; then echo "SELFTEST PASSED"; else echo "SELFTEST FAILED"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: overlay-${{ matrix.v.mc }}
          path: overlay-out/*.jar

      - name: Push logs
        if: always() && steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p logs && cp overlay-*.log logs/ 2>/dev/null || true
          cp shot-*.png logs/ 2>/dev/null || true
          echo "${{ job.status }}" > logs/STATUS
          cd logs && git init -q && git checkout -q -b "ci-logs/overlay-${{ github.run_number }}-$MC"
          git -c user.name=ci -c user.email=ci@localhost add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "logs" || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "ci-logs/overlay-${{ github.run_number }}-$MC" || true

  # Main only: publish the jars that passed to the "overlay" release + a manifest with checksums.
  # Versions that failed keep their previous published jar.
  publish:
    needs: [plan, build]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' && github.workflow == 'Overlay mod' || inputs.publish) }}
    runs-on: ubuntu-latest
    concurrency: overlay-publish
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: overlay-*
          merge-multiple: true
          path: overlay-out
      - name: Publish
        run: |
          shopt -s nullglob
          jars=(overlay-out/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then echo "No version passed; nothing to publish."; exit 1; fi
          gh release view overlay >/dev/null 2>&1 || gh release create overlay --prerelease --latest=false \
            --title "In-game menu (updates automatically)" \
            --notes "Ember downloads the in-game menu from here when you press Play. You don't need to download anything from this page."
          gh release download overlay -p overlay-manifest.json -O old.json 2>/dev/null || echo '{"format":1,"builds":[]}' > old.json
          python3 - <<'PY'
          import hashlib, json, os
          old = {b["mc"]: b for b in json.load(open("old.json")).get("builds", [])}
          builds = []
          for v in json.load(open("mods/ember-overlay/versions.json")):
              f = f"ember-overlay-{v['mc']}.jar"
              p = os.path.join("overlay-out", f)
              if os.path.exists(p):
                  builds.append({"mc": v["mc"], "covers": v["covers"], "file": f, "sha256": hashlib.sha256(open(p, "rb").read()).hexdigest()})
                  print("publish", v["mc"])
              elif v["mc"] in old:
                  builds.append(old[v["mc"]])
                  print("keep previous", v["mc"])
          json.dump({"format": 1, "builds": builds}, open("overlay-manifest.json", "w"), indent=1)
          PY
          # Jars first, manifest last, so players never see a manifest pointing at a missing jar.
          gh release upload overlay overlay-out/*.jar --clobber
          gh release upload overlay overlay-manifest.json --clobber
