name: Build

# Every push to main builds the overlay mod and the Windows installer.
# A GitHub release is published when the commit message contains [release] or a v* tag is pushed.
# Build logs are pushed to ci-logs/<job>-<run> branches so they can be read without the Actions UI.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only pushes don't need a new installer.
    # Docs-only and menu-only pushes don't need a new installer (the menu publishes itself).
    paths-ignore: ["docs/**", "README.md", "mods/ember-overlay/**", ".github/workflows/overlay.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The in-game menu for every supported Minecraft version (cached per version; see overlay.yml).
  overlay:
    uses: ./.github/workflows/overlay.yml

  windows:
    name: Windows installer
    needs: overlay
    if: always()
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      # The official, open-source playit.gg agent (BSD-2), built from a pinned commit and
      # shipped inside the installer so "Invite friends" works without separate downloads.
      # Built once per pinned commit, then restored from cache (saves ~3 minutes per build).
      - name: Cached playit.gg agent
        id: playit-cache
        uses: actions/cache@v4
        with:
          path: playit-build
          key: playitd-89638d480be8d26cdbbdfcb14bc80b356d4e8492-${{ runner.os }}
      - name: Build the playit.gg agent
        continue-on-error: true
        shell: bash
        run: |
          [ -f playit-build/bin/playitd.exe ] || cargo install --git https://github.com/playit-cloud/playit-agent --rev 89638d480be8d26cdbbdfcb14bc80b356d4e8492 --locked playitd --root playit-build 2>&1 | tail -40 | tee playit-build.log
          cp playit-build/bin/playitd.exe apps/desktop/src-tauri/resources/playit/
          curl -fsSL https://raw.githubusercontent.com/playit-cloud/playit-agent/89638d480be8d26cdbbdfcb14bc80b356d4e8492/LICENSE.txt -o apps/desktop/src-tauri/resources/playit/LICENSE-playit.txt || true
          ls -la apps/desktop/src-tauri/resources/playit/ | tee -a playit-build.log
      - name: Fetch overlay jars
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: overlay-*
          merge-multiple: true
          path: overlay-out
      - name: Bundle overlay into the installer
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/resources/overlay
          cp overlay-out/ember-overlay-*.jar apps/desktop/src-tauri/resources/overlay/ 2>/dev/null || true
          # Which jar serves which Minecraft versions (read by the launcher).
          cp mods/ember-overlay/versions.json apps/desktop/src-tauri/resources/overlay/versions.json
          ls -la apps/desktop/src-tauri/resources/overlay | tee overlay-bundle.log
          # Never ship an installer without its offline copy of the menu.
          ls apps/desktop/src-tauri/resources/overlay/ember-overlay-*.jar > /dev/null 2>&1 || { echo "No menu builds passed"; exit 1; }
      # `npm install` (not `npm ci`): the lockfile was created on Linux and npm
      # sometimes skips Windows-only optional packages with `ci`.
      - name: Install JS dependencies
        run: npm install
      - name: Tests
        shell: bash
        run: npm test 2>&1 | tee win-test.log
      - name: Build installer
        shell: bash
        working-directory: apps/desktop
        env:
          EMBER_BUILD: ${{ github.run_number }}
        run: npm run tauri build 2>&1 | tee ../../win-build.log; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        with:
          name: ember-launcher-windows
          path: |
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}-build${{ github.run_number }}"
          # Checksums under the names GitHub gives the assets (spaces become dots); Ember's
          # updater verifies the installer against this file.
          for f in target/release/bundle/nsis/*.exe; do
            echo "$(sha256sum "$f" | cut -d' ' -f1)  $(basename "$f" | tr ' ' '.')"
          done > SHA256SUMS.txt
          # Release notes = this version's section of CHANGELOG.md (shown in Ember's update popup).
          awk -v v="## ${VERSION}" '$0 ~ "^## " { p = (index($0, v) == 1) ; next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Bug fixes and improvements." > notes.md
          printf '\n---\nNew install: download the -setup.exe below. Windows may say "Windows protected your PC" because the installer is not code-signed: choose More info, then Run anyway. Already have Ember? It will offer this update when you open it.\n' >> notes.md
          gh release create "$TAG" target/release/bundle/nsis/*.exe SHA256SUMS.txt \
            --title "Ember Launcher ${VERSION} (build ${{ github.run_number }})" --latest --notes-file notes.md
      - name: Push logs
        if: always()
        shell: bash
        run: |
          mkdir -p logs && cp win-*.log playit-build.log overlay-bundle.log logs/ 2>/dev/null || true
          echo "${{ job.status }}" > logs/STATUS
          cd logs && git init -q -b main && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "windows logs ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs/windows-${{ github.run_number }}
