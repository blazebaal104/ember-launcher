# Dev tool: lists the real method signatures of Minecraft classes the overlay hooks into.
# Push a branch named introspect/<anything>; results are pushed to ci-logs/introspect-<run>.
name: Introspect Minecraft classes

on:
  push:
    branches: ["introspect/**"]

permissions:
  contents: write

jobs:
  javap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Download client jar
        run: |
          MC=$(cat .github/introspect/version.txt)
          URL=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r --arg v "$MC" '.versions[] | select(.id==$v) | .url')
          curl -s "$URL" -o version.json
          curl -s "$(jq -r .downloads.client.url version.json)" -o client.jar
          ls -la client.jar
      - name: javap
        run: |
          mkdir -p out
          while read -r cls; do
            [ -z "$cls" ] && continue
            echo "===== $cls" >> out/javap.txt
            javap -p -cp client.jar "$cls" >> out/javap.txt 2>&1 || echo "MISSING $cls" >> out/javap.txt
          done < .github/introspect/classes.txt
          unzip -l client.jar | grep -E "\.class$" | awk '{print $4}' > out/all-classes.txt
          wc -l out/*
      - name: Push results
        run: |
          cd out
          git init -q -b main
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "introspect ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs/introspect-${{ github.run_number }}
