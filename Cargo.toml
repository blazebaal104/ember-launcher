[workspace]
resolver = "2"
members = ["crates/launcher-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
# Thin LTO + parallel codegen: nearly the same speed at runtime, much faster CI builds.
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
